<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lattice - Архів Експериментів</title>
    <!-- Підключаємо бібліотеку для побудови графіків Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Аналітика 3D Гратки</h1>
        <button id="btn-refresh" class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Оновити дані
        </button>
    </header>

    <div class="container">
        <!-- Таблиця зліва -->
        <div class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2>Список запусків</h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Матеріал</th>
                            <th>Алгоритм</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 2rem;">
                                <div style="display:inline-block; width:20px; height:20px; border:3px solid rgba(0,0,0,0.1); border-radius:50%; border-top-color:#3b82f6; animation:spin 1s ease-in-out infinite;"></div>
                                <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Графіки справа -->
        <div class="main-content glass-panel">
            <h2 id="chart-title" style="display: none;"></h2>
            
            <div id="empty-state" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <h3>Виберіть експеримент з таблиці</h3>
                <p>Натисніть на будь-який рядок зліва, щоб переглянути детальні графіки енергії та температури.</p>
            </div>

            <div class="charts" id="charts-container" style="display: none;">
                <div class="chart-card">
                    <h3 style="margin-top:0; font-size:1rem; font-weight:500; color:var(--text-secondary)">Потенціальна та Повна енергія</h3>
                    <div class="chart-wrapper">
                        <canvas id="energyChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <h3 style="margin-top:0; font-size:1rem; font-weight:500; color:var(--text-secondary)">Кінетична енергія</h3>
                    <div class="chart-wrapper">
                        <canvas id="kineticChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <h3 style="margin-top:0; font-size:1rem; font-weight:500; color:var(--text-secondary)">Температура (K)</h3>
                    <div class="chart-wrapper">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <h3 style="margin-top:0; font-size:1rem; font-weight:500; color:var(--text-secondary)">Середні значення енергії</h3>
                    <div class="chart-wrapper" style="height: 250px;">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
